name: My First GitHub Action

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display a Message
        run: echo "Hello, GitHub Actions!"

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la

      - name: Show Date
        run: date